<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 350px;
      padding: 15px;
      font-family: Arial, sans-serif;
    }
    
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }
    
    .title {
      font-size: 18px;
      font-weight: bold;
      color: #333;
    }
    
    .page-info {
      font-size: 12px;
      color: #666;
      margin-bottom: 10px;
      padding: 5px;
      background: #f5f5f5;
      border-radius: 3px;
    }
    
    .api-section {
      margin-bottom: 15px;
    }
    
    .api-label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
      color: #444;
    }
    
    .api-input {
      width: 100%;
      padding: 8px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 14px;
      box-sizing: border-box;
    }
    
    .controls {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 15px;
    }
    
    .btn {
      padding: 8px 12px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
      transition: background-color 0.2s;
    }
    
    .btn-primary {
      background-color: #4CAF50;
      color: white;
    }
    
    .btn-primary:hover {
      background-color: #45a049;
    }
    
    .btn-secondary {
      background-color: #2196F3;
      color: white;
    }
    
    .btn-secondary:hover {
      background-color: #1976D2;
    }
    
    .btn-warning {
      background-color: #ff9800;
      color: white;
    }
    
    .btn-warning:hover {
      background-color: #f57c00;
    }
    
    .question-display {
      background: #f8f9fa;
      padding: 10px;
      border-radius: 4px;
      margin-bottom: 10px;
      font-size: 14px;
      border-left: 3px solid #2196F3;
    }
    
    .answers-list {
      max-height: 200px;
      overflow-y: auto;
      margin-bottom: 10px;
      border: 1px solid #eee;
      border-radius: 4px;
      padding: 10px;
    }
    
    .answer-item {
      padding: 5px 0;
      border-bottom: 1px solid #f0f0f0;
    }
    
    .answers-header {
      font-weight: bold;
      margin-bottom: 8px;
      color: #666;
    }
    
    .saved-answer {
      color: #4CAF50;
      font-weight: bold;
      padding: 5px;
      background: #f1f8e9;
      border-radius: 3px;
      margin: 5px 0;
    }
    
    .api-answer {
      color: #2196F3;
      font-weight: bold;
      padding: 5px;
      background: #e3f2fd;
      border-radius: 3px;
      margin: 5px 0;
    }
    
    .fill-btn {
      width: 100%;
      padding: 8px;
      background-color: #4CAF50;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      margin-top: 10px;
    }
    
    .fill-btn:hover {
      background-color: #45a049;
    }
    
    .status {
      margin-top: 10px;
      padding: 8px;
      border-radius: 4px;
      font-size: 12px;
      display: none;
    }
    
    .status-visible {
      display: block;
    }
    
    .status-success {
      background-color: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
    }
    
    .status-error {
      background-color: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
    }
    
    .status-info {
      background-color: #d1ecf1;
      color: #0c5460;
      border: 1px solid #bee5eb;
    }
    
    .status-warning {
      background-color: #fff3cd;
      color: #856404;
      border: 1px solid #ffeaa7;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="title">Cheat Assistant</div>
  </div>
  
  <div class="page-info">
    Page: <span id="pageTitle">Loading...</span>
  </div>
  
  <div class="api-section">
    <label class="api-label">DeepSeek API Key:</label>
    <input type="password" id="apiKey" class="api-input" placeholder="Enter your API key">
  </div>
  
  <div class="controls">
    <button id="startBtn" class="btn btn-primary">Start Cheating</button>
    <button id="scanBtn" class="btn btn-secondary">Scan Page</button>
    <button id="answerBtn" class="btn btn-primary">Get Answer</button>
    <button id="clearBtn" class="btn btn-warning">Clear Saved</button>
  </div>
  
  <div id="questionDisplay" class="question-display" style="display: none;">
    No question loaded
  </div>
  
  <div id="answersList" class="answers-list">
    <!-- Answers will be displayed here -->
  </div>
  
  <div id="status" class="status">
    <!-- Status messages will appear here -->
  </div>
  
  <script src="popup.js"></script>
</body>
</html>
